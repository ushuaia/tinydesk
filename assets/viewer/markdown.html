<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markdown</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --code-bg: #f6f8fa;
    --link: #0969da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9198a1;
      --border: #3d444d;
      --code-bg: #151b23;
      --link: #4493f8;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }
  body {
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 16px 16px 48px;
    -webkit-text-size-adjust: 100%;
  }
  .block { min-height: 32px; }
  h1, h2, h3, h4 { line-height: 1.3; margin: 1.3em 0 0.6em; }
  h1 { font-size: 1.7em; }
  h2 { font-size: 1.4em; }
  h3 { font-size: 1.2em; }
  p { margin: 0.6em 0; }
  a { color: var(--link); }
  pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9em;
  }
  :not(pre) > code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
  }
  blockquote {
    margin: 0.8em 0;
    padding-left: 12px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; }
  img { max-width: 100%; height: auto; }
  hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }

  /* Edit mode: source only, full width. */
  #edit { display: none; }
  body.editing { padding: 0; }
  body.editing #content { display: none; }
  body.editing #edit { display: block; height: 100vh; box-sizing: border-box; }
  #source {
    display: block;
    width: 100%;
    height: 100vh;
    box-sizing: border-box;
    border: none;
    outline: none;
    resize: none;
    padding: 12px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>
<div id="content"></div>
<div id="edit">
  <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
</div>
<script src="marked.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const bridge = window.DocBridge;
  const fontScale = parseFloat(params.get('fontScale') || '1');

  function setFontScale(scale) {
    document.body.style.fontSize = (16 * scale) + 'px';
  }
  window.setFontScale = setFontScale;
  setFontScale(fontScale);

  function post(message) {
    if (bridge && bridge.postMessage) {
      bridge.postMessage(JSON.stringify(message));
    }
  }

  // ---- edit mode ----
  const source = document.getElementById('source');
  let editTimer = null;

  source.addEventListener('input', () => {
    if (editTimer) clearTimeout(editTimer);
    editTimer = setTimeout(() => {
      post({ type: 'change', text: source.value });
    }, 300);
  });

  window.setMode = function (mode) {
    document.body.classList.toggle('editing', mode === 'edit');
  };
  window.setRaw = function (text) {
    source.value = text || '';
  };
  window.getRaw = function () {
    return source.value;
  };

  const rendered = new Set();
  let blocks = [];
  let elements = [];

  function renderBlock(el) {
    const index = parseInt(el.dataset.index, 10);
    if (rendered.has(index)) return;
    rendered.add(index);
    el.innerHTML = marked.parse(blocks[index] || '');
    el.style.minHeight = '';
  }

  // Content-anchored progress: instead of raw pixels, remember which block is
  // at the top of the viewport and the offset inside that block. Restoring is
  // then immune to placeholder heights and font-scale changes.
  function anchor() {
    const rollback = window.scrollY;
    for (let i = 0; i < elements.length; i++) {
      const el = elements[i];
      const top = el.offsetTop;
      const bottom = top + el.offsetHeight;
      if (rollback >= top && rollback < bottom) {
        if (!rendered.has(i)) return { kind: 'pixels', scrollY: rollback };
        return {
          kind: 'anchor',
          blockIndex: i,
          offset: rollback - top,
          scrollY: rollback,
        };
      }
    }
    return { kind: 'pixels', scrollY: rollback };
  }

  function flush() {
    if (suppressSave || restoring) return;
    if (document.body.classList.contains('editing')) return;
    const anchor = anchor();
    post({ type: 'progress', ...anchor });
  }

  let timer = null;
  window.addEventListener('scroll', () => {
    if (timer) return;
    timer = setTimeout(() => {
      timer = null;
      flush();
    }, 400);
  });

  // OHOS WebView does not always deliver window scroll events. Poll the
  // position as a fallback so progress is still saved while reading.
  let lastPolledY = -1;
  let lastPollTime = 0;
  setInterval(() => {
    if (suppressSave || restoring) return;
    if (document.body.classList.contains('editing')) return;
    const y = window.scrollY;
    if (y === lastPolledY) return;
    if (Date.now() - lastPollTime < 300) return;
    lastPolledY = y;
    lastPollTime = Date.now();
    flush();
  }, 300);

  // Wait for layout to apply after rendering blocks.
  function nextFrame() {
    return new Promise((resolve) => requestAnimationFrame(resolve));
  }

  // Scroll to a target until the browser actually reports that position.
  // A synchronous scrollTo right after rendering can be clamped before layout.
  async function settleScroll(getTarget, timeout) {
    const startTime = Date.now();
    while (Date.now() - startTime < timeout) {
      await nextFrame();
      const target = getTarget();
      if (!Number.isFinite(target)) return;
      window.scrollTo(0, target);
      await new Promise((resolve) => setTimeout(resolve, 30));
      if (Math.abs(window.scrollY - target) <= 1) return;
    }
  }

  // Render blocks until the document is tall enough to reach `targetY` plus a
  // viewport margin. Without this, scrollTo() is clamped to the current
  // scrollHeight and the reader lands short of the saved position.
  async function ensureScrollable(targetY) {
    const needed = targetY + window.innerHeight * 1.5;
    let i = 0;
    while (i < blocks.length) {
      renderBlock(elements[i]);
      i += 1;
      if (i % 20 === 0) {
        await nextFrame();
        if (document.body.scrollHeight >= needed) return;
      }
    }
    await nextFrame();
  }

  // Content-anchor restore: render the target block, scroll to
  // `el.offsetTop + offset`. Falls back to raw pixels when the anchor isn't
  // readable.
  let restoring = false;
  let suppressSave = true;
  window.__ocReaderReady = false;
  async function restoreProgress(state) {
    if (!state || typeof state !== 'object') {
      suppressSave = false;
      window.__ocReaderReady = true;
      return;
    }
    restoring = true;
    try {
      const rawScrollY = typeof state.scrollY === 'number'
        ? state.scrollY
        : 0;
      // Prefer the raw pixel offset: it is exactly what the reader saw when
      // the page closed. The block anchor is only a fallback for older states
      // that predate scrollY.
      const target = Math.max(0, rawScrollY);
      if (target > 0) {
        await ensureScrollable(target);
        await settleScroll(() => target, 5000);
        return;
      }
      if (typeof state.blockIndex === 'number' && state.blockIndex >= 0) {
        const blockIndex = state.blockIndex;
        const blockOffset = Number.isFinite(state.offset)
          ? Math.max(0, state.offset)
          : 0;
        const targetEl = elements[blockIndex];
        if (!targetEl) return;
        // Render everything up to the target so offsetTop is accurate.
        let i = 0;
        const limit = Math.min(blockIndex + 12, blocks.length);
        while (i < limit) {
          renderBlock(elements[i]);
          i += 1;
          if (i % 20 === 0) await nextFrame();
        }
        await nextFrame();
        await ensureScrollable(targetEl.offsetTop + blockOffset);
        await settleScroll(
          () => targetEl.offsetTop + blockOffset,
          5000,
        );
      }
    } finally {
      restoring = false;
      suppressSave = false;
      window.__ocReaderReady = true;
    }
  }
  // Dart calls this from the global scope via runJavaScript, so it must be
  // exposed on window.
  window.restoreProgress = restoreProgress;

  // Dart restores the offset through ArkWeb's native scroll API, then calls
  // this to release the save guard.
  window.__ocFinishRestore = function () {
    restoring = false;
    suppressSave = false;
    window.__ocReaderReady = true;
  };

  // Guarantee the most recent scroll position lands in the app before the
  // WebView context is gone.
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flush();
  });

  async function load() {
    if (params.get('mode') === 'edit') {
      // Edit mode boots from the raw file served by the app; no block
      // rendering, no progress tracking.
      document.body.classList.add('editing');
      const response = await fetch('/raw');
      source.value = await response.text();
      // Approximate continuity: scroll the source to the same fraction of
      // the document the reader was at.
      const ratio = parseFloat(params.get('pos') || '0');
      if (ratio > 0) {
        requestAnimationFrame(() => {
          source.scrollTop =
            ratio * Math.max(0, source.scrollHeight - source.clientHeight);
        });
      }
      window.__ocReaderReady = true;
      return;
    }
    const response = await fetch('/markdown');
    const data = await response.json();
    blocks = data.blocks || [];
    const content = document.getElementById('content');
    for (let i = 0; i < blocks.length; i++) {
      const el = document.createElement('div');
      el.className = 'block';
      el.dataset.index = String(i);
      content.appendChild(el);
      elements.push(el);
    }

    // Render every block up front. Lazy rendering made the document height
    // depend on which blocks happened to be visible, so the same scrollY
    // mapped to different content when the document was reopened. A stable
    // layout is required for pixel-accurate progress restore.
    for (let i = 0; i < elements.length; i++) {
      renderBlock(elements[i]);
      if (i % 20 === 0) await nextFrame();
    }

    // Ask the app for the saved progress; avoids URL encoding pitfalls.
    window.setTimeout(() => {
      post({ type: 'ready' });
      // If no restore arrives (e.g. no saved state), allow saving shortly.
      window.setTimeout(() => {
        if (!restoring) {
          suppressSave = false;
          window.__ocReaderReady = true;
        }
      }, 1500);
    }, 0);
  }

  load().catch((error) => {
    document.getElementById('content').textContent = '{{viewerLoadFailedPrefix}}' + error;
  });
})();
</script>
</body>
</html>
